syntax = "proto3";

package razpravljalnica;

option go_package ="PS_projekt/api/grpc/protobufRazpravljalnica;razpravljalnica";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
////////////////////////////////////////////////////////////////////////////////
// Basic data types
////////////////////////////////////////////////////////////////////////////////

message User {
  int64 id = 1;
  string name = 2;
  int64 version = 3 ; 
}

message Topic {
  int64 id = 1;
  string name = 2;
  int64 version = 3 ; 
}

message Message {
  int64 id = 1;
  int64 topic_id = 2;
  int64 user_id = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  int32 likes = 6;
  int64 version = 7 ; 
}

message Like {
  int64 topic_id = 1;
  int64 message_id = 2;
  int64 user_id = 3; // user who liked the message
  int64 version = 4 ; 
}

enum OpType {
  OP_POST   = 0; // add a message to a topic
  OP_LIKE   = 1; // like a message
  OP_DELETE = 2; // delete a message
  OP_UPDATE = 3; // update a message
}

message NodeInfo {
  string node_id = 1;
  string address = 2;
}

////////////////////////////////////////////////////////////////////////////////
// Data plane
////////////////////////////////////////////////////////////////////////////////

service  MessageBoard{
  // Writes (only to head)

  // Creates a new user and assigns it an id
  rpc CreateUser(CreateUserRequest) returns (User);

  // Creates a new topic to which users can post messages
  rpc CreateTopic(CreateTopicRequest) returns (Topic);

  // Post a message to a topic; Succed only if the User and the Topic exist in the data base.
  rpc PostMessage(PostMessageRequest) returns (Message);

  // Update an existing message. Allowed only for the user who posted the message.
  rpc UpdateMessage(UpdateMessageRequest) returns (Message);

  // Delete an existing message. Allowed only for the user who posted the message.
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty);

  // Like an existing message. Return the message with the new number of likes.
  rpc LikeMessage(LikeMessageRequest) returns (Message);

  // Request a node to which a subscription can be opened.
  rpc GetSubscriptionNode(SubscriptionNodeRequest) returns (SubscriptionNodeResponse);

  // Reads go to the tail node

  // Returns all the topics
  rpc ListTopics(google.protobuf.Empty) returns (ListTopicsResponse);

  // Returns messages in a topic
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);

  // Subscribe to topics; goes to the node returned by head
  rpc SubscribeTopic(SubscribeTopicRequest) returns (stream MessageEvent);
  //Sync the old tail and the new tail 
  rpc TransferData(stream UploadData) returns (UploadACK);
  //Signal that a new tail has been added 
  rpc SignalNewTail(SyncTailsRequest)returns (SyncTailsACK);
  rpc HeartBeat(HearthBeatRequest) returns (HearthBeatResponse);
  rpc AssignChainNode(AssignRequest) returns (ACK);
  rpc ForwardBatch(BatchRequest) returns (BatchResponse);
  rpc ReadLike(ReadLikeRequest) returns (Like);
  rpc ReadUser(ReadUserRequest) returns (User);
  rpc ReadTopic(ReadTopicRequest) returns (Topic);
  rpc ReadMessage(ReadMessageRequest) returns (Message);
  rpc ListTopicsFromInner(google.protobuf.Empty)returns (ListTopicsResponse);
  rpc ListMessagesFromInner(google.protobuf.Empty)returns (ListMessagesResponse);

}

message CreateUserRequest {
  string name = 1;
  int64 version = 2 ; 
}

message CreateTopicRequest {
  string name = 1;
  int64 version = 2 ; 
}

message PostMessageRequest {
  int64 topic_id = 1;
  int64 user_id = 2;
  string text = 3;
  int64 version = 4 ; 
}

message DeleteMessageRequest {
  int64 topic_id = 1;
  int64 user_id = 2;
  int64 message_id = 3;
  int64 version = 4 ; 
}

message UpdateMessageRequest {
  int64 topic_id = 1;
  int64 user_id = 2;
  int64 message_id = 3;
  string text = 4; // new text
  int64 version = 5 ; 
}

message LikeMessageRequest {
  int64 topic_id = 1;
  int64 message_id = 2;
  int64 user_id = 3; // user who posted the like
  int64 version = 4 ; 
}

message ListTopicsResponse {
  repeated Topic topics = 1;
}

message GetMessagesRequest {
  int64 topic_id = 1;
  int64 from_message_id = 2; // starting id of the message (0 from beggining)
  int32 limit = 3; // max number of messages
}
message GetMessagesResponse {
  repeated Message messages = 1;
}

message SubscribeTopicRequest {
  repeated int64 topic_id = 1;
  int64 user_id = 2;
  int64 from_message_id = 3; // starting id of the message
  string subscribe_token = 4; // token generated by the head used to authorize the subscription
}

message SubscriptionNodeRequest {
  int64 user_id = 1;
  repeated int64 topic_id = 2;
}

message SubscriptionNodeResponse {
  string subscribe_token = 1; // subscription token to be presented to the returned node
  NodeInfo node = 2;
}

message MessageEvent {
  int64 sequence_number = 1; // monotonically increasing event number
  OpType op = 2; // type of event
  Message message = 3;
  google.protobuf.Timestamp event_at = 4; // timestamp of the event
}


message UploadData{
  repeated Like userLikes = 1 ; 
  repeated User users = 2 ; 
  repeated Topic topic = 3 ; 
  repeated Message messages = 4 ;
}



message UploadACK{
  bool succ = 1 ; 
}


///////////////////////////
//signal new tail data 
//////////////////////////
message SyncTailsRequest{
  NodeInfo newTail = 1 ; 
}

message SyncTailsACK{
  bool succ = 1 ; 
}

message ACK{
  bool success = 1 ; 
  int64 version = 2 ; 
  int64 id = 3 ; 
}

///////////////////////////////////////////////////////
//Chain node requests 
///////////////////////////////////////////////////////



message HearthBeatResponse {
  int64 id  =1 ; 
}

message HearthBeatRequest {
  int64 id = 1 ; 
}

message AssignRequest {
  string nextUrl =1;
  string prevUrl =2;
  string clientUrl = 3 ; 
  int64 id =4;
  string tailUrl = 5 ; 
}


message BatchRequest{
  repeated Like userLikes = 1 ; 
  repeated User users = 2 ; 
  repeated Topic topic = 3 ; 
  repeated Message messages = 4 ;
}


message BatchResponse{
   int64 version = 1 ; 
   bool success = 2 ; 
}


///////////////////////////////////////////////////////
//Chain node types 
///////////////////////////////////////////////////////
//
message NodeData{
  int64 id = 1 ;
  string address = 2 ; 
}
service ChainNode{

  rpc Read(ReadRequest) returns (ReadResponse);
  //rpc TransferData(stream Data) returns 
}

///////////////////////////////////////////////////////
//MasterNode
///////////////////////////////////////////////////////
service MasterNode{
  rpc SignalAlive(SignalAliveRequest)returns (SignalAliveResponse);
  rpc ReadFromNodes(ReadRequest) returns (ReadResponse);
  rpc GetClusterState(google.protobuf.Empty)returns(GetClusterStateResponse);
  rpc GenerateRandomNode(google.protobuf.Empty)returns(GenerateRandomNodeResponse);
  rpc SignalNewTail(NewTailRequest) returns (NewTailResponse); 
}
message SignalAliveRequest {
  int64 nodeId = 1 ; 
  string nodeUrl = 2 ;
}

message SignalAliveResponse {
  string masterUrl = 1 ; 
}

message GetClusterStateResponse{
  NodeData head = 1 ; 
  NodeData tail = 2 ; 
}

message GenerateRandomNodeResponse{
  NodeData node = 1 ; 
}

message NewTailRequest{
  int64 id = 1 ; 
  string url = 2 ;
}

message NewTailResponse{
  bool succ = 1 ;
}








message ForwardRequest{
    int64 id = 1; 
   int64 version = 2;
}

message UpdateRequest{
  int64 id = 1; 
   int64 data =2 ; 
}

/////////////////////////////////////////////////
//CRAQ implementation 
/////////////////////////////////////////////////
//

message ReadRequest {
  int64 id = 1 ;
}

message ReadResponse{
  bool ok = 1 ; 
  int64 data = 2 ;
}



message Data {
  repeated razpravljalnica.User users  =1 ; 
  repeated razpravljalnica.Message messages =2 ; 
  repeated razpravljalnica.Topic topics = 3 ; 
  repeated razpravljalnica.Like likes  = 4 ; 

}




/////////////////////////////////////////////////
//RPC calls used to read data primerally used for reading from the tail if the data is not clean 
/////////////////////////////////////////////////

message ReadLikeRequest{
  int64 id = 1 ; 
}

message ReadMessageRequest{
  int64 id = 1 ; 
}

message ReadUserRequest{
  int64 id = 1 ; 
}

message ReadTopicRequest{
  int64 id = 1 ; 
}


message ListMessagesResponse{
   repeated Message messages = 1 ;
}

